# SeatView3D + PostgreSQL 18.
#   cp .env.example .env   # then set POSTGRES_PASSWORD
#   docker compose up -d --build
#   open http://localhost:3001
services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: seatview
      POSTGRES_USER: seatview
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seatview -d seatview"]
      interval: 5s
      timeout: 3s
      retries: 20
    # Not published to the host: only the app container can reach the database.

  app:
    build: .
    restart: unless-stopped
    init: true # tini as PID 1: forwards SIGTERM to node so `docker compose stop` shuts down gracefully
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://seatview:${POSTGRES_PASSWORD}@db:5432/seatview
      APP_ORIGIN: ${APP_ORIGIN:?set APP_ORIGIN in .env, e.g. https://seatview.example}
      SESSION_HOURS: ${SESSION_HOURS:-720}
      HOLD_MINUTES: ${HOLD_MINUTES:-10}
      MOVIEGLU_CLIENT: ${MOVIEGLU_CLIENT:-}
      MOVIEGLU_API_KEY: ${MOVIEGLU_API_KEY:-}
      MOVIEGLU_AUTHORIZATION: ${MOVIEGLU_AUTHORIZATION:-}
      MOVIEGLU_LICENSED: ${MOVIEGLU_LICENSED:-false}
      FEED_REFRESH_MINUTES: ${FEED_REFRESH_MINUTES:-60}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${APP_PORT:-3001}:3001"
    stop_grace_period: 20s

volumes:
  pgdata:
