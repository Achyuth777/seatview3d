# Type checks, unit and API tests (PGlite and PostgreSQL), the migration check, a production build,
# and a browser smoke test against the built app on PostgreSQL. Test databases are throwaway.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: seatview
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: seatview_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U seatview -d seatview_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DB: postgres://seatview:ci-only-password@127.0.0.1:5432/seatview_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit and API tests (embedded PGlite)
        run: npm test

      - name: Unit and API tests (PostgreSQL)
        run: npm test
        env:
          TEST_DATABASE_URL: ${{ env.TEST_DB }}

      - name: Migration check (fresh apply, then a no-op rerun)
        run: npm run migrate:check
        env:
          TEST_DATABASE_URL: ${{ env.TEST_DB }}

      - name: Production build
        run: npm run build

      - name: Browser smoke test (Chromium, discovery and seat preview)
        run: |
          npx playwright install --with-deps chromium
          node e2e/support/reset-test-db.cjs
          SERVE_STATIC=true PORT=3100 node_modules/.bin/tsx server/index.ts &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:3100/api/ready && break; sleep 1; done
          npx playwright test e2e/m2-discovery.spec.ts e2e/m3-seat-preview.spec.ts --project=chromium-desktop
        env:
          DATABASE_URL: ${{ env.TEST_DB }}
          E2E_BASE_URL: http://127.0.0.1:3100
          RATE_LIMIT_MAX: '100000'

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
